<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Mi Radio</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">

  <!-- Tipografía Inter (la más parecida a la de Apple). Se guarda sola para usarla sin internet. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Librería que lee las etiquetas de los archivos (título, artista, álbum, portada) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <!-- ESTILOS: cómo se ve la página -->
  <style>
    :root {
      --rojo: #fa2d48;
      --texto2: #98989f;
      --linea: #2c2c2e;
      --seguro-abajo: env(safe-area-inset-bottom, 0px);
      --seguro-arriba: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { overscroll-behavior: none; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: "Inter", -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.player-abierto { overflow: hidden; }
    button { font-family: inherit; color: inherit; border: none; background: none; padding: 0; cursor: pointer; }
    svg { display: block; fill: currentColor; }
    svg.trazo { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    [hidden] { display: none !important; }

    /* ---------- Contenido de cada pantalla ---------- */
    #vista { padding: 0 16px calc(190px + var(--seguro-abajo)); min-height: 100vh; }

    .cabecera {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
      padding-top: calc(26px + var(--seguro-arriba));
      margin-bottom: 14px;
    }
    .cabecera h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.7px; line-height: 1.1; margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .atras {
      display: flex; align-items: center; gap: 2px;
      color: var(--rojo); font-size: 17px;
      height: 36px; margin: calc(10px + var(--seguro-arriba)) 0 0 -8px;
    }
    .atras svg { width: 26px; height: 26px; }
    .atras + .cabecera { padding-top: 6px; }

    .pastilla { display: flex; align-items: center; background: #1c1c1e; border-radius: 20px; height: 40px; flex-shrink: 0; }
    .pastilla button { width: 46px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--rojo); }
    .pastilla svg { width: 22px; height: 22px; }

    .subtitulo { color: var(--texto2); font-size: 15px; margin: -6px 0 14px; }

    /* Rejillas de álbumes */
    .rejilla { display: grid; gap: 18px 12px; margin: 8px 0 24px; }
    .rejilla.tres { grid-template-columns: repeat(3, 1fr); }
    .rejilla.dos  { grid-template-columns: repeat(2, 1fr); gap: 22px 14px; }
    .tarjeta { cursor: pointer; min-width: 0; }
    .tarjeta .portada { width: 100%; height: auto; aspect-ratio: 1; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.45); }
    .t-nombre, .t-artista { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-nombre  { font-size: 14px; font-weight: 500; margin-top: 8px; }
    .t-artista { font-size: 13px; color: var(--texto2); margin-top: 1px; }

    /* Menú de la biblioteca */
    .menu { list-style: none; margin: 0; padding: 0; }
    .menu li { display: flex; align-items: center; gap: 16px; height: 56px; cursor: pointer; }
    .menu li:active { opacity: .6; }
    .menu li > svg { width: 26px; height: 26px; color: var(--rojo); flex-shrink: 0; margin-left: 2px; }
    .m-texto { flex: 1; align-self: stretch; display: flex; align-items: center; border-bottom: .5px solid var(--linea); font-size: 20px; }
    .menu li:last-child .m-texto { border-bottom: none; }
    .m-cuenta { margin-left: auto; margin-right: 8px; color: var(--texto2); font-size: 17px; }
    .m-texto svg { width: 16px; height: 16px; color: #5b5b60; }

    /* Listas de canciones */
    ul.lista { list-style: none; padding: 0; margin: 0; }
    ul.lista li { display: flex; align-items: center; cursor: pointer; }
    ul.lista li:active { background: #111; }

    .portada {
      position: relative;
      width: 52px; height: 52px;
      border-radius: 6px;
      background: #2c2c2e center / cover no-repeat;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .portada .nota { width: 46%; height: 46%; color: #5b5b60; }
    ul.lista .portada { margin: 8px 14px 8px 0; box-shadow: 0 0 0 .5px rgba(255,255,255,.08); }
    .portada.redonda { border-radius: 50%; }
    .numero { width: 34px; text-align: center; color: var(--texto2); font-size: 16px; margin-right: 10px; flex-shrink: 0; }

    .fila-texto {
      flex: 1; min-width: 0; align-self: stretch;
      display: flex; flex-direction: column; justify-content: center;
      border-bottom: .5px solid var(--linea);
      min-height: 64px;
    }
    ul.lista li:last-child .fila-texto { border-bottom: none; }
    .fila-texto .m-fila { display: flex; align-items: center; }
    .nombre, .artista { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nombre  { font-size: 16px; font-weight: 500; }
    .artista { font-size: 14px; color: var(--texto2); margin-top: 2px; }
    li.sonando .nombre { color: var(--rojo); }
    li.sonando .numero { color: var(--rojo); }
    .fila-texto .m-fila .cuenta { margin-left: auto; margin-right: 8px; color: var(--texto2); font-size: 15px; }
    .fila-texto .m-fila svg { width: 16px; height: 16px; color: #5b5b60; flex-shrink: 0; }

    /* Barritas que bailan sobre la portada de la canción que suena */
    .eq {
      position: absolute; inset: 0;
      display: none; align-items: flex-end; justify-content: center; gap: 3px;
      padding-bottom: 15px; background: rgba(0,0,0,.45);
    }
    li.sonando .eq { display: flex; }
    .eq i {
      width: 4px; height: 18px; background: #fff; border-radius: 2px;
      transform-origin: bottom;
      animation: bailar .9s ease-in-out infinite alternate;
      animation-play-state: paused;
    }
    .eq i:nth-child(2) { animation-delay: -.3s; animation-duration: .7s; }
    .eq i:nth-child(3) { animation-delay: -.6s; animation-duration: 1.1s; }
    body.reproduciendo .eq i { animation-play-state: running; }
    @keyframes bailar { from { transform: scaleY(.25); } to { transform: scaleY(1); } }

    /* Portada grande de un álbum */
    .hero { text-align: center; margin: 4px 0 6px; }
    .hero .portada { width: min(62vw, 260px); height: auto; aspect-ratio: 1; margin: 0 auto; border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.55); }
    .hero h2 { font-size: 21px; font-weight: 700; margin: 16px 0 2px; overflow-wrap: anywhere; }
    .h-artista { color: var(--rojo); font-size: 20px; }
    .h-meta { color: var(--texto2); font-size: 13px; margin-top: 4px; }
    .dos-botones { display: flex; gap: 12px; margin: 16px 0 10px; }
    .dos-botones button {
      flex: 1; height: 48px; border-radius: 12px; background: #1c1c1e; color: var(--rojo);
      font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .dos-botones button:active { opacity: .6; }
    .dos-botones svg { width: 20px; height: 20px; }
    .dos-botones svg.trazo { stroke-width: 2.2; }

    .vacio { text-align: center; color: var(--texto2); padding: 90px 24px 0; }
    .vacio > svg { width: 56px; height: 56px; margin: 0 auto 16px; color: #3a3a3c; }
    .vacio b { display: block; color: #fff; font-size: 20px; margin-bottom: 6px; }
    .vacio .boton-rojo { margin-top: 22px; background: var(--rojo); color: #fff; font-size: 16px; font-weight: 600; padding: 13px 24px; border-radius: 12px; }

    .buscador { display: flex; align-items: center; gap: 8px; background: #1c1c1e; border-radius: 12px; padding: 0 12px; height: 44px; margin-bottom: 14px; }
    .buscador svg { width: 20px; height: 20px; color: var(--texto2); flex-shrink: 0; }
    .buscador input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: #fff; font: inherit; font-size: 17px; }
    .sin-resultados { color: var(--texto2); text-align: center; padding: 50px 20px; }

    /* ---------- Barra de pestañas (abajo) ---------- */
    #tabs {
      position: fixed; z-index: 5;
      left: 10px; right: 10px; bottom: calc(10px + var(--seguro-abajo));
      height: 62px; padding: 5px; border-radius: 31px;
      display: flex;
      background: rgba(44,44,46,.75);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      backdrop-filter: blur(24px) saturate(1.6);
      box-shadow: 0 6px 24px rgba(0,0,0,.5);
    }
    #tabs button {
      flex: 1; border-radius: 26px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-size: 11px; font-weight: 500; color: #c7c7cc;
    }
    #tabs button.activo { color: var(--rojo); background: rgba(255,255,255,.12); }
    #tabs svg { width: 26px; height: 26px; }

    /* ---------- Mini reproductor ---------- */
    #mini {
      position: fixed; z-index: 5;
      left: 10px; right: 10px;
      bottom: calc(80px + var(--seguro-abajo));
      height: 62px; border-radius: 16px; padding: 0 8px;
      display: none; align-items: center; gap: 12px;
      background: rgba(44,44,46,.82);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      backdrop-filter: blur(24px) saturate(1.6);
      box-shadow: 0 6px 24px rgba(0,0,0,.5);
    }
    body.hay-cancion #mini { display: flex; }
    #mini .portada { width: 46px; height: 46px; }
    #mini .abrir { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; }
    #mini .nombre { font-size: 15px; }
    #mini .controles-mini { display: flex; align-items: center; }
    #mini .controles-mini button { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; }
    #mini .controles-mini img { height: 22px; }

    /* Iconos (png) de los controles: el filtro los pone en blanco. Borra "filter" para ver su color original. */
    button img { display: block; width: auto; pointer-events: none; filter: brightness(0) invert(1); }
    .ic-pausa { display: none !important; }
    body.reproduciendo .ic-pausa { display: block !important; }
    body.reproduciendo .ic-play { display: none !important; }

    /* ---------- Reproductor grande ---------- */
    #reproductor {
      position: fixed; inset: 0; z-index: 10;
      background: #111; overflow: hidden;
      transform: translateY(100%);
      transition: transform .38s cubic-bezier(.32,.72,0,1);
      display: flex; flex-direction: column; align-items: center;
    }
    #reproductor.abierto { transform: translateY(0); }

    /* Fondo: la misma portada, muy difuminada */
    #fondo {
      position: absolute; inset: -60px; z-index: -1;
      background: #2a2a2e center / cover no-repeat;
      filter: blur(70px) saturate(1.5) brightness(.5);
    }

    /* Portada (o video) a pantalla completa arriba, que se funde con el fondo */
    .arte {
      position: relative; flex-shrink: 0;
      width: min(100%, max(220px, calc(100vh - 400px)));
      width: min(100%, max(220px, calc(100dvh - 400px)));
      aspect-ratio: 1;
      -webkit-mask-image: linear-gradient(#000 66%, transparent 100%);
      mask-image: linear-gradient(#000 66%, transparent 100%);
    }
    .arte .portada, .arte video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border-radius: 0; object-fit: cover; background-color: #2c2c2e;
    }
    .arte .portada .nota { width: 28%; height: 28%; }

    #cerrar {
      position: absolute; z-index: 2; top: calc(6px + var(--seguro-arriba)); left: 50%; transform: translateX(-50%);
      width: 90px; height: 30px; display: flex; align-items: center; justify-content: center;
    }
    #cerrar span { width: 44px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.6); box-shadow: 0 0 8px rgba(0,0,0,.35); }

    .resto {
      position: relative; flex: 1; width: 100%; max-width: 480px;
      margin-top: -40px; padding: 0 24px calc(16px + var(--seguro-abajo));
      display: flex; flex-direction: column; justify-content: space-evenly;
    }
    .fila-info { display: flex; align-items: center; gap: 2px; }
    .fila-info .info { flex: 1; min-width: 0; margin-right: 6px; }
    #gNombre  { font-size: 21px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #gArtista { font-size: 19px; color: rgba(255,255,255,.65); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-icono { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; position: relative; }
    .btn-icono svg { width: 24px; height: 24px; }
    .btn-icono:active { opacity: .6; }
    .estrella { stroke-width: 1.9; }
    .estrella.lleno { fill: currentColor; }

    input[type=range].barra {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 22px; margin: 0; background: transparent; --p: 0%;
    }
    input[type=range].barra::-webkit-slider-runnable-track {
      height: 5px; border-radius: 3px;
      background: linear-gradient(to right, rgba(255,255,255,.85) var(--p), rgba(255,255,255,.25) var(--p));
    }
    input[type=range].barra::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; border-radius: 50%; background: #fff; margin-top: -4.5px;
    }
    input[type=range].barra::-moz-range-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.25); }
    input[type=range].barra::-moz-range-progress { height: 5px; border-radius: 3px; background: rgba(255,255,255,.85); }
    input[type=range].barra::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: #fff; }
    .tiempos { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: rgba(255,255,255,.55); margin-top: 2px; font-variant-numeric: tabular-nums; }

    .controles { display: flex; align-items: center; justify-content: center; gap: 48px; }
    .controles button { display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; }
    .controles button:active { opacity: .6; }
    .controles .lado img { height: 30px; }
    .controles .central img { height: 50px; }

    .volumen { display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,.6); }
    .volumen svg { width: 18px; height: 18px; flex-shrink: 0; }

    .fila-extra { display: flex; justify-content: center; gap: 64px; color: rgba(255,255,255,.6); }
    .fila-extra .btn-icono { border-radius: 12px; }
    .fila-extra .btn-icono.activo { color: #fff; background: rgba(255,255,255,.22); }
    .insignia {
      position: absolute; top: 4px; right: 3px; display: none;
      width: 14px; height: 14px; border-radius: 7px; background: #fff; color: #000;
      font-size: 10px; font-weight: 700; align-items: center; justify-content: center;
    }

    /* ---------- Hoja de opciones (aparece desde abajo) ---------- */
    .hoja-fondo { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .25s; }
    .hoja-fondo.abierta { opacity: 1; pointer-events: auto; }
    .hoja {
      position: fixed; z-index: 31; left: 8px; right: 8px; bottom: calc(8px + var(--seguro-abajo));
      display: flex; flex-direction: column; gap: 8px;
      transform: translateY(125%); transition: transform .3s cubic-bezier(.32,.72,0,1);
    }
    .hoja.abierta { transform: none; }
    .hoja-grupo { background: #2c2c2e; border-radius: 16px; overflow: hidden; }
    .hoja-titulo { text-align: center; color: var(--texto2); font-size: 13px; padding: 14px 16px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hoja-grupo button { display: block; width: 100%; height: 56px; font-size: 18px; border-top: .5px solid #3a3a3c; color: #fff; }
    .hoja-grupo button.peligro { color: var(--rojo); }
    .hoja-grupo button.negrita { font-weight: 600; border-top: none; }
    .hoja-grupo button:active { background: #3a3a3c; }

    /* ---------- Radio ---------- */
    body.modo-radio .fila-extra { visibility: hidden; }
    body.hablando #btnFav, body.hablando #btnMas { visibility: hidden; }
    .radio-card {
      position: relative; overflow: hidden; text-align: center;
      border-radius: 20px; padding: 30px 20px 22px; margin-top: 6px;
      background: linear-gradient(155deg, #fa2d48 0%, #8a1233 55%, #1c1c1e 100%);
      box-shadow: 0 14px 40px rgba(250,45,72,.18);
    }
    .radio-logo { width: 104px; height: 104px; margin: 0 auto 16px; border-radius: 24px; background: #111 center / cover no-repeat; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
    .radio-nombre { font-size: 34px; font-weight: 700; letter-spacing: -.6px; }
    .radio-sub { font-size: 17px; color: rgba(255,255,255,.75); margin-top: 2px; }
    .en-vivo { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 4px 10px; border-radius: 12px; background: rgba(0,0,0,.35); font-size: 12px; font-weight: 700; letter-spacing: .6px; }
    .en-vivo i { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: latir 1.4s ease-in-out infinite; }
    @keyframes latir { 50% { opacity: .25; } }
    .boton-radio { width: 100%; height: 54px; margin-top: 22px; border-radius: 14px; background: #fff; color: #000; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .boton-radio svg { width: 20px; height: 20px; }
    .boton-radio:active { opacity: .75; }
    .boton-radio.parar { background: rgba(0,0,0,.4); color: #fff; }
    .radio-info { margin-top: 24px; }
    .radio-info h3 { font-size: 13px; font-weight: 600; color: var(--texto2); text-transform: uppercase; letter-spacing: .5px; margin: 0 0 4px; }
    .radio-fila { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: .5px solid var(--linea); font-size: 16px; }
    .radio-fila:last-child { border-bottom: none; }
    .radio-fila.vacia { color: #5b5b60; }
    .radio-fila span:last-child { color: var(--texto2); font-size: 15px; }
    .radio-nota { color: var(--texto2); font-size: 13px; line-height: 1.45; margin-top: 16px; }

    #aviso {
      position: fixed; z-index: 50; top: calc(12px + var(--seguro-arriba)); left: 50%;
      transform: translate(-50%, -200%); transition: transform .3s;
      background: rgba(62,62,64,.97); padding: 10px 18px; border-radius: 20px;
      font-size: 14px; font-weight: 500; max-width: 90vw; text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,.5);
    }
    #aviso.visible { transform: translate(-50%, 0); }
  </style>
</head>

<body>
  <!-- Dibujos (iconos) que se reutilizan en toda la app -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-nota" viewBox="0 0 24 24"><polygon points="9,5.2 19,3 19,6.8 9,9"/><rect x="8.8" y="5" width="2" height="11.5"/><rect x="16.8" y="3" width="2" height="11.5"/><ellipse cx="7.6" cy="17" rx="3.2" ry="2.5"/><ellipse cx="15.6" cy="15" rx="3.2" ry="2.5"/></symbol>
    <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-puntos" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></symbol>
    <symbol id="i-estrella" viewBox="0 0 24 24"><polygon points="12,3.4 14.41,9.28 20.75,9.76 15.9,13.87 17.41,20.04 12,16.7 6.59,20.04 8.1,13.87 3.25,9.76 9.59,9.28"/></symbol>
    <symbol id="i-micro" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M5.5 11a6.5 6.5 0 0 0 13 0 M12 17.5V21 M8.5 21h7"/></symbol>
    <symbol id="i-album" viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="12" rx="2.5"/><path d="M6.5 5.5h11M8.5 2.5h7"/></symbol>
    <symbol id="i-buscar" viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13z M20 20l-4.8-4.8"/></symbol>
    <symbol id="i-radio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M8.2 8.2a5.4 5.4 0 0 0 0 7.6M15.8 8.2a5.4 5.4 0 0 1 0 7.6M5.4 5.4a9.4 9.4 0 0 0 0 13.2M18.6 5.4a9.4 9.4 0 0 1 0 13.2"/></symbol>
    <symbol id="i-chevron-der" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-chevron-izq" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-play-s" viewBox="0 0 24 24"><path d="M7.5 4.9v14.2c0 .8.9 1.3 1.6.9l11.2-7.1c.6-.4.6-1.4 0-1.8L9.1 4c-.7-.4-1.6.1-1.6.9z"/></symbol>
    <symbol id="i-aleatorio" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22 M18 2l4 4-4 4 M2 6h1.9c1.5 0 2.9.9 3.6 2.2 M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8 M18 14l4 4-4 4"/></symbol>
    <symbol id="i-repetir" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4 M3 11v-1a4 4 0 0 1 4-4h14 M7 22l-4-4 4-4 M21 13v1a4 4 0 0 1-4 4H3"/></symbol>

  </svg>

  <!-- Aquí se dibuja la pantalla actual (inicio, álbumes, artistas...) -->
  <div id="vista"></div>

  <section id="reproductor" aria-label="Reproductor">

        <button class="btn-icono" id="btnFav" aria-label="Favorita"><svg class="trazo estrella"><use href="#i-estrella"/></svg></button>
        <button class="btn-icono" id="btnMas" aria-label="Más opciones"><svg><use href="#i-puntos"/></svg></button>

      </div>

      <div class="controles">
        <button class="lado btn-anterior" aria-label="Anterior"><img src="icono-atras.png" alt=""></button>

          <img class="ic-pausa" src="icono-pausa.png" alt="">

      <div class="fila-extra">

        <button class="btn-icono" id="btnRepetir" aria-label="Repetir"><svg class="trazo"><use href="#i-repetir"/></svg><span class="insignia" id="insigniaRepetir">1</span></button>

  <!-- Hoja de opciones -->
  <div class="hoja-fondo" id="hojaFondo"></div>
  <div class="hoja" id="hoja">
    <div class="hoja-grupo" id="hojaGrupo"></div>
    <div class="hoja-grupo"><button class="negrita" id="hojaCancelar">Cancelar</button></div>
  </div>

  <div id="aviso"></div>

  <audio id="audio"></audio>
  <input type="file" id="selector" accept="audio/*" multiple hidden>
  <input type="file" id="selectorVideo" accept="video/*" hidden>

  <!-- PROGRAMA: lo que hace la página -->
  <script>
    // ========== Utilidades ==========
    const $ = (id) => document.getElementById(id);
    const NS = "http://www.w3.org/2000/svg";

    // Crea un elemento HTML: el("div", "clase", "texto")
    function el(tag, clase, texto) {
      const e = document.createElement(tag);
      if (clase) e.className = clase;
      if (texto !== undefined && texto !== null) e.textContent = texto;
      return e;
    }
    // Crea un icono usando uno de los dibujos del principio
    function icono(id, clase) {
      const s = document.createElementNS(NS, "svg");
      if (clase) s.setAttribute("class", clase);
      const u = document.createElementNS(NS, "use");
      u.setAttribute("href", "#" + id);
      s.appendChild(u);
      return s;
    }
    const normalizar = (t) => (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

    // ========== Elementos de la página ==========
    const vista = $("vista"), audio = $("audio");
    const selector = $("selector"), selectorVideo = $("selectorVideo");
    const miniPortada = $("miniPortada"), miniNombre = $("miniNombre"), miniArtista = $("miniArtista");
    const reproductor = $("reproductor"), fondo = $("fondo");
    const arteImg = $("arteImg"), arteVideo = $("arteVideo");
    const gNombre = $("gNombre"), gArtista = $("gArtista");
    const barraProgreso = $("barraProgreso"), barraVolumen = $("barraVolumen");
    const tActual = $("tActual"), tRestante = $("tRestante");
    const btnFav = $("btnFav"), btnAleatorio = $("btnAleatorio"), btnRepetir = $("btnRepetir");

    // ========== Estado de la app ==========
    let canciones = [];            // toda la biblioteca
    let favoritos = new Set();     // ids de canciones favoritas
    let clavesAnimadas = new Set();// álbumes que tienen portada animada
    let cargada = false;

    let cancion = null;            // la canción que suena
    let cola = [], colaOriginal = [], pos = -1;   // lista que va sonando y posición
    let aleatorio = false, repetir = 0;           // repetir: 0 no, 1 todo, 2 una
    let urlAudio = null, urlVideo = null, claveVideo = null;
    let arrastrando = false, abierto = false;
    let bd;

    let pila = [{ tipo: "inicio", scroll: 0 }];   // pantallas por las que has ido entrando
    let historialOk = true;

    // ========== Base de datos (así la app recuerda todo) ==========
    function abrirBD() {
      return new Promise((ok, fallo) => {
        const peticion = indexedDB.open("mi-radio", 2);
        peticion.onupgradeneeded = () => {
          const d = peticion.result;
          if (!d.objectStoreNames.contains("canciones")) d.createObjectStore("canciones", { keyPath: "id", autoIncrement: true });
          if (!d.objectStoreNames.contains("animadas")) d.createObjectStore("animadas", { keyPath: "clave" });
        };
        peticion.onsuccess = () => ok(peticion.result);
        peticion.onerror = () => fallo(peticion.error);
      });
    }
    function transaccion(almacen, modo, operacion) {
      return new Promise((ok, fallo) => {
        const t = bd.transaction(almacen, modo);
        const resultado = operacion(t.objectStore(almacen));
        t.oncomplete = () => ok(resultado && resultado.result);
        t.onerror = () => fallo(t.error);
        t.onabort = () => fallo(t.error);
      });
    }

    function cargarFavoritos() {
      try { favoritos = new Set(JSON.parse(localStorage.getItem("mi-radio-favoritas") || "[]")); } catch (e) {}
    }
    function guardarFavoritos() {
      try { localStorage.setItem("mi-radio-favoritas", JSON.stringify([...favoritos])); } catch (e) {}
    }

    // ========== Avisos y hoja de opciones ==========
    let temporizadorAviso;
    function aviso(texto, ms = 2600) {
      const a = $("aviso");
      a.textContent = texto;
      a.classList.add("visible");
      clearTimeout(temporizadorAviso);
      if (ms) temporizadorAviso = setTimeout(() => a.classList.remove("visible"), ms);
    }

    function mostrarHoja(titulo, opciones) {
      const grupo = $("hojaGrupo");
      grupo.replaceChildren(el("div", "hoja-titulo", titulo));
      opciones.forEach(o => {
        const b = el("button", o.peligro ? "peligro" : "", o.texto);
        b.addEventListener("click", () => { cerrarHoja(); o.accion(); });
        grupo.append(b);
      });
      $("hojaFondo").classList.add("abierta");
      $("hoja").classList.add("abierta");
    }
    function cerrarHoja() {
      $("hojaFondo").classList.remove("abierta");
      $("hoja").classList.remove("abierta");
    }
    $("hojaFondo").addEventListener("click", cerrarHoja);
    $("hojaCancelar").addEventListener("click", cerrarHoja);

    // ========== Ordenar y agrupar la biblioteca ==========
    const cmp = (a, b) => (a || "").localeCompare(b || "", "es", { sensitivity: "base", numeric: true });
    const porPista = (a, b) => (a.pista || 0) - (b.pista || 0) || cmp(a.titulo, b.titulo);
    const porAlbumYPista = (a, b) => cmp(a.album, b.album) || porPista(a, b);
    const porGeneral = (a, b) => cmp(a.artista, b.artista) || cmp(a.album, b.album) || porPista(a, b);

    const nombreArtista = (c) => c.artista || "Artista desconocido";
    const claveAlbum = (c) => nombreArtista(c) + "||" + (c.album || "Sin álbum");

    function ordenar() { canciones.sort(porGeneral); }

    function agrupar() {
      const albumes = new Map(), artistas = new Map();
      for (const c of canciones) {
        const ka = claveAlbum(c);
        let a = albumes.get(ka);
        if (!a) {
          a = { clave: ka, nombre: c.album || "Sin álbum", artista: nombreArtista(c), canciones: [], portada: null, ultimoId: 0 };
          albumes.set(ka, a);
        }
        a.canciones.push(c);
        if (!a.portada && c.portada) a.portada = c.portada;
        a.ultimoId = Math.max(a.ultimoId, c.id);

        let r = artistas.get(nombreArtista(c));
        if (!r) { r = { nombre: nombreArtista(c), canciones: [], portada: null }; artistas.set(r.nombre, r); }
        r.canciones.push(c);
        if (!r.portada && c.portada) r.portada = c.portada;
      }
      albumes.forEach(a => a.canciones.sort(porPista));
      artistas.forEach(r => r.canciones.sort(porAlbumYPista));
      return {
        albumes: [...albumes.values()].sort((a, b) => cmp(a.nombre, b.nombre)),
        artistas: [...artistas.values()].sort((a, b) => cmp(a.nombre, b.nombre))
      };
    }

    // ========== Piezas de pantalla ==========
    function ponerPortada(elemento, url) {
      elemento.style.backgroundImage = url ? `url(${url})` : "none";
      const nota = elemento.querySelector(".nota");
      if (nota) nota.style.display = url ? "none" : "block";
    }
    function crearPortada(url, extra) {
      const p = el("div", "portada" + (extra ? " " + extra : ""));
      p.append(icono("i-nota", "nota"));
      ponerPortada(p, url);
      return p;
    }
    function barritas() {
      const e = el("div", "eq");
      e.append(el("i"), el("i"), el("i"));
      return e;
    }

    function cabecera(titulo, opc = {}) {
      const frag = document.createDocumentFragment();
      if (opc.atras) {
        const b = el("button", "atras");
        b.append(icono("i-chevron-izq", "trazo"), el("span", "", opc.atras));
        b.addEventListener("click", atras);
        frag.append(b);
      }
      const h = el("header", "cabecera");
      h.append(el("h1", "", titulo));
      if (opc.acciones) h.append(opc.acciones);
      frag.append(h);
      return frag;
    }

    function tarjetaAlbum(a) {
      const t = el("div", "tarjeta");
      t.append(crearPortada(a.portada), el("div", "t-nombre", a.nombre), el("div", "t-artista", a.artista));
      t.addEventListener("click", () => ir({ tipo: "album", clave: a.clave, nombre: a.nombre }));
      return t;
    }

    // Lista de canciones. opc.numeros: muestra el número de pista en vez de la portada.
    function filasCanciones(lista, opc = {}) {
      const ul = el("ul", "lista");
      lista.forEach((c, i) => {
        const li = el("li");
        li.dataset.id = c.id;
        if (opc.numeros) {
          li.append(el("div", "numero", String(c.pista || i + 1)));
        } else {
          const p = crearPortada(c.portada);
          p.append(barritas());
          li.append(p);
        }
        const t = el("div", "fila-texto");
        t.append(el("div", "nombre", c.titulo));
        if (!opc.numeros) t.append(el("div", "artista", nombreArtista(c)));
        li.append(t);
        li.addEventListener("click", () => reproducirLista(lista, i));
        ul.append(li);
      });
      return ul;
    }

    function botonesReproducir(lista) {
      const d = el("div", "dos-botones");
      const b1 = el("button");
      b1.append(icono("i-play-s"), el("span", "", "Reproducir"));
      b1.addEventListener("click", () => reproducirLista(lista, 0));
      const b2 = el("button");
      b2.append(icono("i-aleatorio", "trazo"), el("span", "", "Aleatorio"));
      b2.addEventListener("click", () => reproducirLista(lista, 0, true));
      d.append(b1, b2);
      return d;
    }

    function vacio() {
      const d = el("div", "vacio");
      d.append(icono("i-nota"), el("b", "", "Tu biblioteca está vacía"), el("span", "", "Añade las canciones de tus artistas."));
      const b = el("button", "boton-rojo", "Añadir canciones");
      b.addEventListener("click", () => selector.click());
      d.append(b);
      return d;
    }

    // ========== Pantallas ==========
    function vistaInicio() {
      const pastilla = el("div", "pastilla");
      const bMas = el("button"); bMas.setAttribute("aria-label", "Añadir canciones");
      bMas.append(icono("i-mas", "trazo"));
      bMas.addEventListener("click", () => selector.click());
      const bPuntos = el("button"); bPuntos.setAttribute("aria-label", "Más opciones");
      bPuntos.append(icono("i-puntos"));
      bPuntos.addEventListener("click", menuBiblioteca);
      pastilla.append(bMas, bPuntos);
      vista.append(cabecera("Biblioteca", { acciones: pastilla }));

      if (!cargada) return;
      if (canciones.length === 0) { vista.append(vacio()); return; }

      const g = agrupar();
      const rejilla = el("div", "rejilla tres");
      g.albumes.slice().sort((a, b) => b.ultimoId - a.ultimoId).slice(0, 6)
        .forEach(a => rejilla.append(tarjetaAlbum(a)));
      vista.append(rejilla);

      const menu = el("ul", "menu");
      const nFavoritas = canciones.filter(c => favoritos.has(c.id)).length;
      [
        ["i-estrella", "Favoritas", nFavoritas, "favoritas"],
        ["i-micro", "Artistas", g.artistas.length, "artistas"],
        ["i-album", "Álbumes", g.albumes.length, "albumes"],
        ["i-nota", "Canciones", canciones.length, "canciones"]
      ].forEach(([ic, texto, n, tipo]) => {
        const li = el("li");
        const t = el("div", "m-texto");
        t.append(el("span", "", texto), el("span", "m-cuenta", String(n)), icono("i-chevron-der", "trazo"));
        li.append(icono(ic, ic === "i-nota" ? "" : "trazo"), t);
        li.addEventListener("click", () => ir({ tipo }));
        menu.append(li);
      });
      vista.append(menu);
    }

    function vistaCanciones() {
      vista.append(cabecera("Canciones", { atras: nombreVista(pila[pila.length - 2]) }));
      vista.append(el("div", "subtitulo", `${canciones.length} canciones`));
      vista.append(filasCanciones(canciones));
    }

    function vistaFavoritas() {
      const lista = canciones.filter(c => favoritos.has(c.id));
      vista.append(cabecera("Favoritas", { atras: nombreVista(pila[pila.length - 2]) }));
      if (!lista.length) {
        vista.append(el("div", "sin-resultados", "Toca la estrella en el reproductor para marcar tus canciones favoritas."));
        return;
      }
      vista.append(botonesReproducir(lista), filasCanciones(lista));
    }

    function vistaArtistas() {
      vista.append(cabecera("Artistas", { atras: nombreVista(pila[pila.length - 2]) }));
      const ul = el("ul", "lista");
      agrupar().artistas.forEach(r => {
        const li = el("li");
        li.append(crearPortada(r.portada, "redonda"));
        const t = el("div", "fila-texto");
        const fila = el("div", "m-fila");
        fila.append(el("span", "nombre", r.nombre), el("span", "cuenta", String(r.canciones.length)), icono("i-chevron-der", "trazo"));
        fila.querySelector(".nombre").style.fontSize = "18px";
        t.append(fila);
        li.append(t);
        li.addEventListener("click", () => ir({ tipo: "artista", clave: r.nombre }));
        ul.append(li);
      });
      vista.append(ul);
    }

    function vistaAlbumes() {
      vista.append(cabecera("Álbumes", { atras: nombreVista(pila[pila.length - 2]) }));
      const rejilla = el("div", "rejilla dos");
      agrupar().albumes.forEach(a => rejilla.append(tarjetaAlbum(a)));
      vista.append(rejilla);
    }

    function vistaArtista(v) {
      const r = agrupar().artistas.find(x => x.nombre === v.clave);
      vista.append(cabecera(v.clave, { atras: nombreVista(pila[pila.length - 2]) }));
      vista.append(botonesReproducir(r.canciones), filasCanciones(r.canciones));
    }

    function vistaAlbum(v) {
      const a = agrupar().albumes.find(x => x.clave === v.clave);
      vista.append(cabecera("", { atras: nombreVista(pila[pila.length - 2]) }));
      vista.querySelector(".cabecera").remove();
      const hero = el("div", "hero");
      hero.append(crearPortada(a.portada), el("h2", "", a.nombre), el("div", "h-artista", a.artista),
        el("div", "h-meta", `${a.canciones.length} ${a.canciones.length === 1 ? "canción" : "canciones"}`));
      vista.append(hero, botonesReproducir(a.canciones), filasCanciones(a.canciones, { numeros: true }));
    }

    function vistaRadio() {
      const emisora = (radioDatos && radioDatos.emisora) || "MNZ FM";
      const locutora = (radioDatos && radioDatos.locutora) || "Mimi";
      vista.append(cabecera("Radio"));

      const tarjeta = el("div", "radio-card");
      const logo = el("div", "radio-logo");
      logo.style.backgroundImage = "url(icon-512.png)";
      tarjeta.append(logo, el("div", "radio-nombre", emisora), el("div", "radio-sub", `con ${locutora}`));
      if (modoRadio) {
        const vivo = el("div", "en-vivo");
        vivo.append(el("i"), el("span", "", "EN VIVO"));
        tarjeta.append(vivo);
      }
      const boton = el("button", "boton-radio" + (modoRadio ? " parar" : ""));
      if (modoRadio) boton.append(el("span", "", "Detener radio"));
      else boton.append(icono("i-play-s"), el("span", "", `Escuchar ${emisora}`));
      boton.addEventListener("click", () => { if (modoRadio) detenerRadio(); else iniciarRadio(); });
      tarjeta.append(boton);
      vista.append(tarjeta);

      // Los artistas de la emisora y cuántas canciones tienes de cada uno
      const info = el("div", "radio-info");
      info.append(el("h3", "", "Artistas de la emisora"));
      artistasRadio().forEach(a => {
        const n = canciones.filter(c => artistaRadio(c) === a).length;
        const fila = el("div", "radio-fila" + (n ? "" : " vacia"));
        fila.append(el("span", "", a.nombre), el("span", "", n ? `${n} ${n === 1 ? "canción" : "canciones"}` : "sin canciones"));
        info.append(fila);
      });
      vista.append(info);

      let nota = "";
      if (!radioDatos) nota = "No encuentro frases.json, así que la radio sonará sin que Mimi hable.";
      else if (vozMimi === "audios") nota = `La voz de ${locutora} viene de los audios que generaste.`;
      else if (vozMimi === "movil") nota = `Aún no hay audios de ${locutora}: por ahora habla con la voz de tu celular.`;
      if (nota) vista.append(el("div", "radio-nota", nota));
    }

    function vistaBuscar(v) {
      vista.append(cabecera("Buscar"));
      const caja = el("label", "buscador");
      const entrada = el("input");
      entrada.type = "search";
      entrada.placeholder = "Canciones, artistas o álbumes";
      entrada.value = v.q || "";
      caja.append(icono("i-buscar", "trazo"), entrada);
      const resultados = el("div");
      vista.append(caja, resultados);

      const pintar = () => {
        v.q = entrada.value;
        const q = normalizar(entrada.value.trim());
        resultados.replaceChildren();
        if (!q) { resultados.append(el("div", "sin-resultados", "Busca en tu biblioteca.")); return; }
        const lista = canciones.filter(c => normalizar(`${c.titulo} ${c.artista} ${c.album}`).includes(q));
        resultados.append(lista.length ? filasCanciones(lista) : el("div", "sin-resultados", "No hay resultados."));
        marcarSonando();
      };
      entrada.addEventListener("input", pintar);
      pintar();
    }

    function nombreVista(v) {
      if (!v) return "Atrás";
      return {
        inicio: "Biblioteca", canciones: "Canciones", favoritas: "Favoritas", artistas: "Artistas",
        albumes: "Álbumes", artista: v.clave, album: v.nombre, radio: "Radio", buscar: "Buscar"
      }[v.tipo];
    }

    // ========== Navegación ==========
    function renderizar() {
      const v = pila[pila.length - 1];

      // Si el artista o álbum ya no existe (por ejemplo, se borró), volvemos atrás
      if (pila.length > 1 && cargada && (v.tipo === "artista" || v.tipo === "album")) {
        const g = agrupar();
        const existe = v.tipo === "artista" ? g.artistas.some(x => x.nombre === v.clave) : g.albumes.some(x => x.clave === v.clave);
        if (!existe) { pila.pop(); renderizar(); return; }
      }

      vista.replaceChildren();
      ({ inicio: vistaInicio, canciones: vistaCanciones, favoritas: vistaFavoritas, artistas: vistaArtistas,
         albumes: vistaAlbumes, artista: vistaArtista, album: vistaAlbum, radio: vistaRadio, buscar: vistaBuscar }[v.tipo])(v);

      document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("activo", b.dataset.tab === pila[0].tipo));
      marcarSonando();
    }

    // Entra a una pantalla nueva
    function ir(v) {
      pila[pila.length - 1].scroll = window.scrollY;
      pila.push(v);
      try { history.pushState({ v: pila.length, r: abierto ? 1 : 0 }, ""); } catch (e) { historialOk = false; }
      renderizar();
      window.scrollTo(0, 0);
    }
    // Vuelve a la pantalla anterior
    function atras() {
      if (pila.length <= 1) return;
      if (historialOk && history.state && history.state.v === pila.length) history.back();
      else { pila.pop(); renderizar(); window.scrollTo(0, pila[pila.length - 1].scroll || 0); }
    }
    function cambiarTab(tipo) {
      const profundidad = pila.length;
      pila = [{ tipo, scroll: 0 }];
      renderizar();
      window.scrollTo(0, 0);
      if (profundidad > 1 && historialOk) { try { history.go(-(profundidad - 1)); } catch (e) {} }
    }
    document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => cambiarTab(b.dataset.tab)));

    // Botón "atrás" de Android: cierra el reproductor o sube una pantalla
    window.addEventListener("popstate", (e) => {
      const s = e.state || { v: 1, r: 0 };
      if (abierto && !s.r) cerrarVisual();
      if (pila.length > s.v) {
        while (pila.length > s.v) pila.pop();
        renderizar();
        window.scrollTo(0, pila[pila.length - 1].scroll || 0);
      }
    });

    // Marca en rojo la canción que suena en cualquier lista
    function marcarSonando() {
      document.querySelectorAll("#vista li[data-id]").forEach(li =>
        li.classList.toggle("sonando", !!cancion && Number(li.dataset.id) === cancion.id));
    }

    // ========== Importar canciones ==========
    function leerEtiquetas(archivo) {
      const porDefecto = { titulo: archivo.name.replace(/\.[^/.]+$/, ""), artista: "", album: "", pista: 0, portadaBlob: null };
      return new Promise(resolver => {
        if (typeof jsmediatags === "undefined") return resolver(porDefecto);
        jsmediatags.read(archivo, {
          onSuccess: (resultado) => {
            const t = resultado.tags;
            resolver({
              titulo: t.title || porDefecto.titulo,
              artista: t.artist || "",
              album: t.album || "",
              pista: parseInt(t.track, 10) || 0,
              portadaBlob: t.picture ? new Blob([new Uint8Array(t.picture.data)], { type: t.picture.format }) : null
            });
          },
          onError: () => resolver(porDefecto)
        });
      });
    }

    function prepararFicha(c) {
      c.portada = c.portadaBlob ? URL.createObjectURL(c.portadaBlob) : null;
    }

    selector.addEventListener("change", async () => {
      const archivos = Array.from(selector.files);
      let nuevas = 0, fallo = false;

      for (let n = 0; n < archivos.length; n++) {
        const archivo = archivos[n];
        aviso(`Importando ${n + 1} de ${archivos.length}...`, 0);
        if (canciones.some(c => c.nombreArchivo === archivo.name && c.tamano === archivo.size)) continue;

        const datos = await leerEtiquetas(archivo);
        const ficha = {
          archivo, nombreArchivo: archivo.name, tamano: archivo.size,
          titulo: datos.titulo, artista: datos.artista, album: datos.album,
          pista: datos.pista, portadaBlob: datos.portadaBlob
        };
        try {
          ficha.id = await transaccion("canciones", "readwrite", s => s.add(ficha));
        } catch (error) { fallo = true; break; }
        prepararFicha(ficha);
        canciones.push(ficha);
        nuevas++;
      }

      selector.value = "";
      ordenar();
      renderizar();
      if (fallo) aviso("No se pudo guardar (¿falta espacio en el teléfono?)");
      else aviso(nuevas > 0 ? `Se añadieron ${nuevas} canciones` : "Esas canciones ya estaban");
    });

    // ========== Menús de opciones ==========
    function menuBiblioteca() {
      mostrarHoja("Biblioteca", [
        { texto: "Añadir canciones", accion: () => selector.click() },
        { texto: "Vaciar biblioteca", peligro: true, accion: vaciarBiblioteca }
      ]);
    }

    async function vaciarBiblioteca() {
      if (canciones.length === 0) return;
      if (!confirm("¿Borrar todas las canciones y portadas animadas de la app? Tus archivos originales no se tocan.")) return;
      salirRadio();
      cerrarReproductor();
      audio.pause();
      audio.removeAttribute("src");
      await transaccion("canciones", "readwrite", s => s.clear());
      await transaccion("animadas", "readwrite", s => s.clear());
      canciones = []; clavesAnimadas = new Set(); favoritos = new Set(); guardarFavoritos();
      cola = []; colaOriginal = []; pos = -1; cancion = null;
      quitarVideo();
      document.body.classList.remove("hay-cancion", "reproduciendo");
      pila = [{ tipo: "inicio", scroll: 0 }];
      renderizar();
    }

    function menuCancion() {
      const c = cancion;
      if (!c) return;
      const tiene = clavesAnimadas.has(claveAlbum(c));
      const opciones = [{ texto: tiene ? "Cambiar portada animada…" : "Añadir portada animada…", accion: () => selectorVideo.click() }];
      if (tiene) opciones.push({ texto: "Quitar portada animada", accion: quitarAnimada });
      opciones.push({ texto: "Eliminar de la biblioteca", peligro: true, accion: () => eliminarCancion(c) });
      mostrarHoja(c.titulo, opciones);
    }

    async function eliminarCancion(c) {
      if (!confirm(`¿Eliminar "${c.titulo}" de la biblioteca? Tu archivo original no se toca.`)) return;
      await transaccion("canciones", "readwrite", s => s.delete(c.id));
      canciones = canciones.filter(x => x !== c);
      favoritos.delete(c.id); guardarFavoritos();
      cola = cola.filter(x => x !== c);
      colaOriginal = colaOriginal.filter(x => x !== c);
      radioBolsa = radioBolsa.filter(x => x !== c);
      if (modoRadio && cancion === c) salirRadio();
      else if (modoRadio && radioSig === c) radioSig = radioElegir(radioActual);
      if (cancion === c) {
        cerrarReproductor();
        audio.pause();
        audio.removeAttribute("src");
        cancion = null; pos = -1;
        quitarVideo();
        document.body.classList.remove("hay-cancion", "reproduciendo");
      }
      renderizar();
      aviso("Canción eliminada");
    }

    // ========== Portada animada ==========
    function quitarVideo() {
      arteVideo.pause();
      arteVideo.removeAttribute("src");
      arteVideo.load();
      arteVideo.hidden = true;
      claveVideo = null;
      if (urlVideo) { URL.revokeObjectURL(urlVideo); urlVideo = null; }
    }

    // Si el álbum de la canción tiene un video guardado, lo pone sobre la portada
    async function ponerVideo() {
      if (!cancion) return;
      const clave = claveAlbum(cancion);
      if (claveVideo === clave) { sincronizarVideo(); return; }   // mismo álbum: el video ya está
      quitarVideo();
      if (!clavesAnimadas.has(clave)) return;
      const c = cancion;
      try {
        const registro = await transaccion("animadas", "readonly", s => s.get(clave));
        if (!registro || cancion !== c) return;
        urlVideo = URL.createObjectURL(registro.video);
        claveVideo = clave;
        arteVideo.src = urlVideo;
        arteVideo.hidden = false;
        sincronizarVideo();
      } catch (e) {}
    }

    // El video solo se mueve mientras suena la música y el reproductor está abierto
    function sincronizarVideo() {
      if (arteVideo.hidden) return;
      if (abierto && !audio.paused && !hablando) arteVideo.play().catch(() => {});
      else arteVideo.pause();
    }

    arteVideo.addEventListener("error", () => {
      if (!arteVideo.getAttribute("src")) return;
      quitarVideo();
      aviso("Ese video no se pudo reproducir. Prueba con un mp4 (H.264).", 4000);
    });

    selectorVideo.addEventListener("change", async () => {
      const archivo = selectorVideo.files[0];
      selectorVideo.value = "";
      if (!archivo || !cancion) return;
      const clave = claveAlbum(cancion);
      try {
        await transaccion("animadas", "readwrite", s => s.put({ clave, video: archivo, nombre: archivo.name }));
        clavesAnimadas.add(clave);
        quitarVideo();
        await ponerVideo();
        aviso("Portada animada añadida a este álbum");
      } catch (e) { aviso("No se pudo guardar el video"); }
    });

    async function quitarAnimada() {
      if (!cancion) return;
      const clave = claveAlbum(cancion);
      await transaccion("animadas", "readwrite", s => s.delete(clave));
      clavesAnimadas.delete(clave);
      quitarVideo();
      aviso("Portada animada quitada");
    }

    // ========== Reproducción ==========
    function barajar(lista, primera) {
      const resto = lista.filter(c => c !== primera);
      for (let i = resto.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [resto[i], resto[j]] = [resto[j], resto[i]];
      }
      return primera ? [primera, ...resto] : resto;
    }

    // Empieza a sonar una lista (un álbum, un artista, todas las canciones...)
    function reproducirLista(lista, i, mezclar) {
      if (!lista.length) return;
      if (modoRadio) salirRadio();   // si eliges otra cosa para escuchar, se apaga la radio
      colaOriginal = lista.slice();
      if (mezclar) { aleatorio = true; i = Math.floor(Math.random() * lista.length); }
      const inicio = lista[i];
      cola = aleatorio ? barajar(colaOriginal, inicio) : colaOriginal.slice();
      pos = cola.indexOf(inicio);
      pintarExtras();
      sonar();
    }

    function sonar() {
      cancion = cola[pos];
      if (urlAudio) URL.revokeObjectURL(urlAudio);
      urlAudio = URL.createObjectURL(cancion.archivo);
      audio.src = urlAudio;
      audio.play().catch(() => {});
      mostrarActual();
      marcarSonando();
    }

    function siguiente() {
      if (modoRadio) { radioSaltar(); return; }
      if (!cola.length) return;
      pos = (pos + 1) % cola.length;
      sonar();
    }
    function anterior() {
      if (modoRadio) { if (!hablando) audio.currentTime = 0; return; }   // la radio no vuelve atrás: reinicia la canción
      if (!cola.length) return;
      if (audio.currentTime > 3) { audio.currentTime = 0; return; }   // si ya van 3 segundos, reinicia
      pos = (pos - 1 + cola.length) % cola.length;
      sonar();
    }

    audio.addEventListener("ended", () => {
      if (modoRadio) {
        if (hablando) siguienteClip(radioSecuencia); else radioFinCancion();
        return;
      }
      if (repetir === 2) { audio.currentTime = 0; audio.play(); }
      else if (pos < cola.length - 1) { pos++; sonar(); }
      else if (repetir === 1) { pos = 0; sonar(); }
      // si no, se acaba la lista y se detiene
    });

    function mostrarActual() {
      const c = cancion;
      document.body.classList.add("hay-cancion");
      miniNombre.textContent = gNombre.textContent = c.titulo;
      miniArtista.textContent = gArtista.textContent = nombreArtista(c);
      ponerPortada(miniPortada, c.portada);
      ponerPortada(arteImg, c.portada);
      fondo.style.backgroundImage = c.portada ? `url(${c.portada})` : "none";
      pintarFavorito();
      ponerVideo();

      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: c.titulo, artist: c.artista, album: c.album,
          artwork: c.portada ? [{ src: c.portada }] : []
        });
      }
    }

    function pintarFavorito() {
      btnFav.querySelector("svg").classList.toggle("lleno", !!cancion && favoritos.has(cancion.id));
    }
    btnFav.addEventListener("click", () => {
      if (!cancion) return;
      if (favoritos.has(cancion.id)) favoritos.delete(cancion.id); else favoritos.add(cancion.id);
      guardarFavoritos();
      pintarFavorito();
    });
    $("btnMas").addEventListener("click", menuCancion);

    // ========== Radio MNZ FM ==========
    // Si no se encuentra frases.json, la radio igual suena con estos artistas
    const ARTISTAS_POR_DEFECTO = [
      { nombre: "The Weeknd" }, { nombre: "Tame Impala" }, { nombre: "BROCKHAMPTON" },
      { nombre: "Silk Sonic", alias: ["Bruno Mars Anderson Paak", "Anderson Paak Bruno Mars"] },
      { nombre: "Solange" }, { nombre: "Doja Cat" }
    ];
    let radioDatos = null;        // lo que dice frases.json
    let vozMimi = null;           // "audios" si hay audios generados, "movil" si habla con la voz del celular
    let modoRadio = false;        // ¿la radio está encendida?
    let radioActual = null;       // canción de radio que suena
    let radioSig = null;          // la que viene después
    let radioBolsa = [];          // canciones que faltan por sonar en esta vuelta
    let radioContador = 0;        // canciones desde la última vez que habló Mimi
    let radioObjetivo = 4;        // cada cuántas canciones habla (4 o 5)
    let radioCharla = null;       // lo que dirá Mimi cuando termine la canción
    let radioSecuencia = null;    // lo que Mimi está diciendo ahora
    let radioCerrando = false;    // Mimi se está despidiendo
    let radioCalentada = false;
    let hablando = false;         // Mimi está hablando
    let hablandoMovil = false;    // y lo hace con la voz del celular
    const clipsUsados = new Set();
    const urlsClips = new Map();
    const clipsFaltantes = new Set();

    const compacto = (t) => normalizar(t).replace(/[^a-z0-9]/g, "");
    const limpiarTitulo = (t) => compacto(String(t || "").replace(/\(.*?\)|\[.*?\]/g, "").replace(/\s[-–—]\s.*$/, ""));
    const artistasRadio = () => (radioDatos && radioDatos.artistas) || ARTISTAS_POR_DEFECTO;
    const azar45 = () => 4 + Math.floor(Math.random() * 2);
    const alAzar = (lista) => lista[Math.floor(Math.random() * lista.length)];

    // ¿De cuál de los artistas de la radio es esta canción? (null si de ninguno)
    function artistaRadio(c) {
      if (!c) return null;
      const t = compacto(c.artista);
      if (!t) return null;
      return artistasRadio().find(a => [a.nombre, ...(a.alias || [])].some(n => t.includes(compacto(n)))) || null;
    }

    function franjaHoraria() {
      const h = new Date().getHours();
      return h >= 5 && h < 12 ? "manana" : h >= 12 && h < 19 ? "tarde" : "noche";
    }

    // ----- Frases y audios de Mimi -----
    async function cargarFrases() {
      try {
        const r = await fetch("frases.json", { cache: "no-cache" });
        if (!r.ok) throw new Error("sin frases");
        const d = await r.json();
        if (!Array.isArray(d.clips) || !Array.isArray(d.artistas)) throw new Error("formato");
        radioDatos = d;
        // ¿Hay audios de Mimi? Lo comprobamos con el primer saludo
        const prueba = d.clips.find(c => c.tipo === "saludo");
        vozMimi = (prueba && await cargarClip(prueba)) ? "audios" : "movil";
      } catch (e) {
        radioDatos = null;
        vozMimi = null;
      }
      if (pila[pila.length - 1].tipo === "radio") renderizar();
    }

    // Descarga un audio de Mimi y devuelve su dirección (o null si no existe)
    async function cargarClip(clip) {
      if (urlsClips.has(clip.id)) return urlsClips.get(clip.id);
      if (clipsFaltantes.has(clip.id)) return null;
      try {
        const r = await fetch(`mimi/${clip.id}.mp3`);
        if (!r.ok) throw new Error("no está");
        let blob = await r.blob();
        if (!blob.size || /html|json|text/i.test(blob.type)) throw new Error("no es audio");
        if (!blob.type) blob = new Blob([blob], { type: "audio/mpeg" });
        const url = URL.createObjectURL(blob);
        urlsClips.set(clip.id, url);
        return url;
      } catch (e) {
        clipsFaltantes.add(clip.id);
        return null;
      }
    }

    // Descarga todos los audios en segundo plano para que luego suenen también sin internet
    async function calentarCache() {
      if (radioCalentada || !radioDatos || vozMimi !== "audios") return;
      radioCalentada = true;
      const pendientes = radioDatos.clips.filter(c => !urlsClips.has(c.id));
      for (let i = 0; i < pendientes.length; i += 3) {
        await Promise.all(pendientes.slice(i, i + 3).map(c =>
          fetch(`mimi/${c.id}.mp3`).then(r => r.blob()).catch(() => {})));
      }
    }

    // Elige al azar un audio que cumpla la condición, evitando los que ya dijo
    function elegirClip(condicion) {
      if (!radioDatos) return null;
      const todos = radioDatos.clips.filter(condicion);
      if (!todos.length) return null;
      const libres = todos.filter(c => !clipsUsados.has(c.id));
      if (!libres.length) todos.forEach(c => clipsUsados.delete(c.id));   // ya dijo todos: vuelven a entrar
      return alAzar(libres.length ? libres : todos);
    }
    function introClip(momento, artista) {
      if (!artista) return null;
      return elegirClip(c => c.tipo === "intro" && c.momento === momento && c.artista === artista.nombre);
    }

    // Decide qué dirá Mimi entre dos canciones: un dato de la que acaba de sonar o de la que viene
    // (de la canción, del álbum o del artista), un dato random o un aviso de la emisora.
    function planCharla(prev, sig, reintento) {
      if (!radioDatos) return null;
      const aPrev = artistaRadio(prev), aSig = artistaRadio(sig);
      const datos = radioDatos.clips.filter(c => c.tipo === "dato");
      const libres = (lista) => lista.filter(c => !clipsUsados.has(c.id));
      const opciones = [];
      const sumar = (peso, momento, artista, lista) => {
        const l = libres(lista);
        if (l.length) opciones.push({ peso, momento, artista, clip: alAzar(l) });
      };

      [["despues", prev, aPrev], ["antes", sig, aSig]].forEach(([momento, cn, a]) => {
        if (!cn || !a) return;
        sumar(4, momento, a, datos.filter(c => c.ambito === "cancion" && c.artista === a.nombre && limpiarTitulo(c.cancion) === limpiarTitulo(cn.titulo)));
        sumar(3, momento, a, datos.filter(c => c.ambito === "album" && c.artista === a.nombre && cn.album && limpiarTitulo(c.album) === limpiarTitulo(cn.album)));
        sumar(3, momento, a, datos.filter(c => c.ambito === "artista" && c.artista === a.nombre));
      });
      sumar(3, null, null, radioDatos.clips.filter(c => c.tipo === "gracioso"));
      sumar(1, null, null, radioDatos.clips.filter(c => c.tipo === "enlace"));

      if (!opciones.length) {
        if (reintento) return null;
        // Ya dijo todo lo que sabe: empieza de nuevo
        radioDatos.clips.forEach(c => { if (c.tipo !== "saludo" && c.tipo !== "cierre") clipsUsados.delete(c.id); });
        return planCharla(prev, sig, true);
      }

      const total = opciones.reduce((s, o) => s + o.peso, 0);
      let x = Math.random() * total, elegido = opciones[0];
      for (const o of opciones) { x -= o.peso; if (x <= 0) { elegido = o; break; } }

      const clips = [];
      if (elegido.momento) {
        // "Eso fue X" + dato, o "Y ahora, X" + dato
        const intro = introClip(elegido.momento, elegido.artista);
        if (intro) clips.push(intro);
        clips.push(elegido.clip);
      } else {
        // dato random o aviso + "Y ahora, X"
        clips.push(elegido.clip);
        const intro = introClip("antes", aSig);
        if (intro) clips.push(intro);
      }
      return { clips };
    }

    // ----- Qué canción suena -----
    function radioElegir(despuesDe) {
      const validas = canciones.filter(c => artistaRadio(c));
      if (!validas.length) return null;
      radioBolsa = radioBolsa.filter(c => canciones.includes(c));
      if (!radioBolsa.length) radioBolsa = barajar(validas.filter(c => c !== despuesDe || validas.length === 1));
      // Nunca dos canciones seguidas del mismo artista (si hay más de uno)
      const art = despuesDe ? artistaRadio(despuesDe) : null;
      let i = radioBolsa.findIndex(c => !art || artistaRadio(c) !== art);
      if (i < 0 && art) {
        const otras = barajar(validas.filter(c => artistaRadio(c) !== art && !radioBolsa.includes(c)));
        if (otras.length) {
          radioBolsa.push(...otras);
          i = radioBolsa.findIndex(c => artistaRadio(c) !== art);
        }
      }
      if (i < 0) i = 0;
      return radioBolsa.splice(i, 1)[0];
    }

    function radioReproducir(c) {
      radioActual = c;
      hablando = false;
      document.body.classList.remove("hablando");
      cancion = c;
      cola = [c]; colaOriginal = [c]; pos = 0;
      if (urlAudio) URL.revokeObjectURL(urlAudio);
      urlAudio = URL.createObjectURL(c.archivo);
      audio.src = urlAudio;
      audio.play().catch(() => {});
      mostrarActual();
      marcarSonando();

      // Deja listo lo que viene: la siguiente canción y, si toca, lo que dirá Mimi
      radioSig = radioElegir(c);
      radioContador++;
      radioCharla = null;
      if (radioSig && radioContador >= radioObjetivo) {
        radioCharla = planCharla(c, radioSig);
        if (radioCharla) radioCharla.clips.forEach(cl => cargarClip(cl));
      }
    }

    // Se acabó la canción: o entra Mimi, o sigue la siguiente
    function radioFinCancion() {
      const siguiente = radioSig || radioElegir(radioActual);
      if (!siguiente) { radioApagar(); return; }
      const plan = radioCharla;
      radioCharla = null;
      if (plan && plan.clips.length) {
        radioContador = 0;
        radioObjetivo = azar45();
        hablarSecuencia(plan.clips, () => radioReproducir(siguiente));
      } else {
        radioReproducir(siguiente);
      }
    }

    // ----- Encender y apagar -----
    function iniciarRadio() {
      if (!canciones.some(c => artistaRadio(c))) {
        aviso("Añade canciones de los artistas de la radio para empezar", 3500);
        return;
      }
      salirRadio();
      audio.pause();
      cola = []; colaOriginal = []; pos = -1;
      modoRadio = true;
      document.body.classList.add("modo-radio");
      radioBolsa = []; radioContador = 0; radioObjetivo = azar45();
      radioCharla = null;
      clipsUsados.clear();

      const primera = radioElegir(null);
      const apertura = [];
      const saludo = elegirClip(c => c.tipo === "saludo" && c.franja === franjaHoraria());
      if (saludo) apertura.push(saludo);
      const intro = introClip("antes", artistaRadio(primera));
      if (intro) apertura.push(intro);

      calentarCache();
      if (apertura.length) hablarSecuencia(apertura, () => radioReproducir(primera));
      else radioReproducir(primera);
      renderizar();
    }

    function detenerRadio() {
      if (!modoRadio) return;
      if (radioSecuencia) { radioSecuencia.cancelado = true; radioSecuencia = null; }
      try { speechSynthesis.cancel(); } catch (e) {}
      if (radioCerrando) { radioApagar(); return; }   // si toca otra vez durante la despedida, se corta
      const cierre = elegirClip(c => c.tipo === "cierre");
      audio.pause();
      radioCharla = null;
      if (cierre) { radioCerrando = true; hablarSecuencia([cierre], radioApagar); }
      else radioApagar();
      renderizar();
    }

    // Apaga todo: sin radio, sin canción, sin mini reproductor
    function radioApagar() {
      salirRadio();
      audio.pause();
      audio.removeAttribute("src");
      cancion = null; cola = []; colaOriginal = []; pos = -1;
      document.body.classList.remove("hay-cancion", "reproduciendo");
      cerrarReproductor();
      marcarSonando();
      renderizar();
    }

    // Sale del modo radio sin tocar la música (para cuando eliges otra cosa para escuchar)
    function salirRadio() {
      if (radioSecuencia) { radioSecuencia.cancelado = true; radioSecuencia = null; }
      try { speechSynthesis.cancel(); } catch (e) {}
      modoRadio = false; hablando = false; hablandoMovil = false; radioCerrando = false;
      radioCharla = null; radioSig = null; radioActual = null;
      document.body.classList.remove("modo-radio", "hablando");
    }

    // Botón "siguiente" en modo radio: si Mimi habla, la corta; si suena una canción, pasa a la siguiente
    function radioSaltar() {
      if (hablando && radioSecuencia) {
        const sec = radioSecuencia;
        sec.cancelado = true;
        try { speechSynthesis.cancel(); } catch (e) {}
        radioSecuencia = null; hablando = false; hablandoMovil = false;
        document.body.classList.remove("hablando");
        sec.alFinal();
        return;
      }
      if (radioSig) radioReproducir(radioSig);
    }

    // ----- Mimi habla -----
    function hablarSecuencia(clips, alFinal) {
      const sec = { clips, i: 0, alFinal, cancelado: false };
      radioSecuencia = sec;
      hablando = true;
      document.body.classList.add("hablando");
      quitarVideo();
      mostrarMimi();
      siguienteClip(sec);
    }

    async function siguienteClip(sec) {
      if (sec !== radioSecuencia || sec.cancelado) return;
      if (sec.i >= sec.clips.length) { finHabla(sec); return; }
      const clip = sec.clips[sec.i++];
      clipsUsados.add(clip.id);
      const url = await cargarClip(clip);
      if (sec !== radioSecuencia || sec.cancelado) return;
      if (url) {
        hablandoMovil = false;
        audio.src = url;
        audio.play().catch((e) => { if (!e || e.name !== "AbortError") siguienteClip(sec); });
      } else {
        decirConVozMovil(clip.texto, () => siguienteClip(sec));   // no hay audio: habla el celular
      }
    }

    function finHabla(sec) {
      if (sec !== radioSecuencia) return;
      radioSecuencia = null;
      hablando = false;
      document.body.classList.remove("hablando");
      sec.alFinal();
    }

    // Respaldo: la voz de texto a voz del propio celular
    function decirConVozMovil(texto, alFinal) {
      if (!("speechSynthesis" in window)) { alFinal(); return; }
      let listo = false, t;
      const fin = () => {
        if (listo) return;
        listo = true; clearTimeout(t); hablandoMovil = false;
        alFinal();
      };
      try {
        speechSynthesis.cancel();
        // las etiquetas de expresión ([laughs], [whispers]...) son solo para la voz de ElevenLabs: aquí no se leen
        const u = new SpeechSynthesisUtterance(String(texto).replace(/\s*\[[^\]]*\]\s*/g, " ").trim());
        const voces = speechSynthesis.getVoices();
        const voz = voces.find(v => /^es[-_](419|MX|US|CO|AR|PE|CL)/i.test(v.lang)) || voces.find(v => /^es/i.test(v.lang));
        if (voz) u.voice = voz;
        u.lang = voz ? voz.lang : "es-419";
        u.rate = 1.05; u.pitch = 1.1;
        u.onend = fin; u.onerror = fin;
        t = setTimeout(fin, 4000 + texto.length * 90);   // por si el celular nunca avisa que terminó
        hablandoMovil = true;
        document.body.classList.add("reproduciendo");
        speechSynthesis.speak(u);
      } catch (e) { fin(); }
    }

    // Mientras habla Mimi, el reproductor muestra a Mimi y a la emisora
    function mostrarMimi() {
      const nombre = (radioDatos && radioDatos.locutora) || "Mimi";
      const emisora = (radioDatos && radioDatos.emisora) || "MNZ FM";
      miniNombre.textContent = gNombre.textContent = nombre;
      miniArtista.textContent = gArtista.textContent = emisora;
      document.body.classList.add("hay-cancion");
      ponerPortada(miniPortada, "icon-512.png");
      ponerPortada(arteImg, "icon-512.png");
      fondo.style.backgroundImage = "url(icon-512.png)";
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: nombre, artist: emisora, album: "En vivo",
          artwork: [{ src: "icon-512.png", sizes: "512x512", type: "image/png" }]
        });
      }
    }

    // Si un audio de Mimi está dañado, pasa al siguiente en vez de quedarse callada
    audio.addEventListener("error", () => {
      if (modoRadio && hablando && radioSecuencia) siguienteClip(radioSecuencia);
    });

    // ========== Aleatorio y repetir ==========
    function pintarExtras() {
      btnAleatorio.classList.toggle("activo", aleatorio);
      btnRepetir.classList.toggle("activo", repetir > 0);
      $("insigniaRepetir").style.display = repetir === 2 ? "flex" : "none";
    }
    btnAleatorio.addEventListener("click", () => {
      aleatorio = !aleatorio;
      if (cancion && colaOriginal.includes(cancion)) {
        cola = aleatorio ? barajar(colaOriginal, cancion) : colaOriginal.slice();
        pos = cola.indexOf(cancion);
      }
      pintarExtras();
    });
    btnRepetir.addEventListener("click", () => { repetir = (repetir + 1) % 3; pintarExtras(); });

    // ========== Botones de reproducción ==========
    function alternar() {
      if (hablando && hablandoMovil) {   // Mimi habla con la voz del celular: pausar / seguir
        if (speechSynthesis.paused) { speechSynthesis.resume(); document.body.classList.add("reproduciendo"); }
        else { speechSynthesis.pause(); document.body.classList.remove("reproduciendo"); }
        return;
      }
      if (!cancion) { if (canciones.length) reproducirLista(canciones, 0); return; }
      audio.paused ? audio.play() : audio.pause();
    }
    document.querySelectorAll(".btn-play").forEach(b => b.addEventListener("click", alternar));
    document.querySelectorAll(".btn-siguiente").forEach(b => b.addEventListener("click", siguiente));
    document.querySelectorAll(".btn-anterior").forEach(b => b.addEventListener("click", anterior));

    audio.addEventListener("play",  () => { document.body.classList.add("reproduciendo"); sincronizarVideo(); });
    audio.addEventListener("pause", () => { document.body.classList.remove("reproduciendo"); sincronizarVideo(); });

    // ========== Barras de progreso y volumen ==========
    function formato(segundos) {
      if (!isFinite(segundos) || segundos < 0) return "0:00";
      const m = Math.floor(segundos / 60), s = Math.floor(segundos % 60);
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    function pintarProgreso() {
      const total = audio.duration || 0;
      const valor = total ? (audio.currentTime / total) * 1000 : 0;
      if (!arrastrando) {
        barraProgreso.value = valor;
        barraProgreso.style.setProperty("--p", (valor / 10) + "%");
        tActual.textContent = formato(audio.currentTime);
        tRestante.textContent = "-" + formato(total - audio.currentTime);
      }
      if ("mediaSession" in navigator && total) {
        try { navigator.mediaSession.setPositionState({ duration: total, position: audio.currentTime, playbackRate: audio.playbackRate }); } catch (e) {}
      }
    }
    audio.addEventListener("timeupdate", pintarProgreso);
    audio.addEventListener("loadedmetadata", pintarProgreso);

    barraProgreso.addEventListener("input", () => {
      arrastrando = true;
      const total = audio.duration || 0, valor = barraProgreso.value;
      barraProgreso.style.setProperty("--p", (valor / 10) + "%");
      tActual.textContent = formato((valor / 1000) * total);
      tRestante.textContent = "-" + formato(total - (valor / 1000) * total);
    });
    barraProgreso.addEventListener("change", () => {
      if (audio.duration) audio.currentTime = (barraProgreso.value / 1000) * audio.duration;
      arrastrando = false;
    });

    barraVolumen.addEventListener("input", () => {
      audio.volume = barraVolumen.value / 100;
      barraVolumen.style.setProperty("--p", barraVolumen.value + "%");
    });
    barraVolumen.style.setProperty("--p", "100%");

    // ========== Abrir y cerrar el reproductor grande ==========
    function abrirReproductor() {
      if ((!cancion && !hablando) || abierto) return;   // también se abre mientras habla Mimi
      abierto = true;
      reproductor.classList.add("abierto");
      document.body.classList.add("player-abierto");
      try { history.pushState({ v: pila.length, r: 1 }, ""); } catch (e) { historialOk = false; }
      sincronizarVideo();
    }
    function cerrarVisual() {
      abierto = false;
      reproductor.classList.remove("abierto");
      document.body.classList.remove("player-abierto");
      sincronizarVideo();
    }
    function cerrarReproductor() {
      if (!abierto) return;
      if (historialOk && history.state && history.state.r) history.back(); else cerrarVisual();
    }
    $("abrirGrande").addEventListener("click", abrirReproductor);
    $("cerrar").addEventListener("click", cerrarReproductor);

    // Desliza hacia abajo para cerrar
    let y0 = null, dy = 0;
    reproductor.addEventListener("touchstart", (e) => {
      if (e.target.closest("input, button")) return;
      y0 = e.touches[0].clientY; dy = 0;
    }, { passive: true });
    reproductor.addEventListener("touchmove", (e) => {
      if (y0 === null) return;
      dy = Math.max(0, e.touches[0].clientY - y0);
      reproductor.style.transition = "none";
      reproductor.style.transform = `translateY(${dy}px)`;
      e.preventDefault();
    }, { passive: false });
    reproductor.addEventListener("touchend", () => {
      if (y0 === null) return;
      y0 = null;
      reproductor.style.transition = "";
      reproductor.style.transform = "";
      if (dy > 120) cerrarReproductor();
    });

    // ========== Controles en la notificación de Android ==========
    if ("mediaSession" in navigator) {
      const accion = (nombre, f) => { try { navigator.mediaSession.setActionHandler(nombre, f); } catch (e) {} };
      accion("play",          () => audio.play());
      accion("pause",         () => audio.pause());
      accion("previoustrack", anterior);
      accion("nexttrack",     siguiente);
      accion("seekto",        (d) => { audio.currentTime = d.seekTime; });
    }

    // ========== Al abrir la app ==========
    async function iniciar() {
      cargarFavoritos();
      try { history.replaceState({ v: 1, r: 0 }, ""); } catch (e) { historialOk = false; }
      renderizar();
      try {
        bd = await abrirBD();
        canciones = await transaccion("canciones", "readonly", s => s.getAll());
        clavesAnimadas = new Set(await transaccion("animadas", "readonly", s => s.getAllKeys()));
        canciones.forEach(prepararFicha);
        ordenar();
        cargada = true;
        renderizar();
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      } catch (error) {
        cargada = true;
        renderizar();
        aviso("No se pudo abrir la biblioteca guardada.", 4000);
      }
    }
    iniciar();
    cargarFrases();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
